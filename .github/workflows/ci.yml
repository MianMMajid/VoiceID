name: CI - Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install frontend dependencies
        run: npm ci
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Run frontend linter
        run: npm run lint
      
      - name: Run backend linter
        run: cd backend && npm run lint
      
      - name: Run frontend tests
        run: npm test
      
      - name: Run backend tests
        run: cd backend && npm test
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20.x'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
  
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install frontend dependencies
        run: npm ci
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Build frontend packages
        run: npm run build
      
      - name: Build backend packages
        run: cd backend && npm run build
      
      - name: Create Lambda deployment package
        run: |
          cd backend/packages/serverless
          mkdir -p dist
          zip -r dist/lambda.zip dist/ node_modules/ package.json
      
      - name: Create Lambda layer package
        run: |
          cd backend/packages/serverless
          mkdir -p layer/nodejs
          cp -r node_modules layer/nodejs/
          cd layer && zip -r ../dist/layer.zip . && cd ..
      
      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: |
            backend/packages/serverless/dist/lambda.zip
            backend/packages/serverless/dist/layer.zip
          retention-days: 7
      
      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: packages/client/dist/
          retention-days: 7
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run npm audit (frontend)
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Run npm audit (backend)
        run: cd backend && npm audit --audit-level=moderate
        continue-on-error: true
